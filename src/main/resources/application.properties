spring.application.name=nightbite
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:mem:nightbite;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

jwt.secret=${JWT_SECRET:nightbite-super-secret-key-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
