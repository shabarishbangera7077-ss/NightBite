<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NightBite Sign Up</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container screen-center">
    <div class="auth-box">
      <h2>Sign Up</h2>
      <div id="message" class="alert" style="display:none"></div>
      <form id="signupForm">
        <label>Name<input type="text" id="name" required></label>
        <label>Email<input type="email" id="email" required></label>
        <label>Password<input type="password" id="password" required></label>
        <label>Phone<input type="text" id="phone" required></label>
        <label>Hostel Block<input type="text" id="hostelBlock" required></label>
        <label>Room Number<input type="text" id="roomNumber" required></label>
        <label>Role
          <select id="role">
            <option value="STUDENT">Student</option>
            <option value="VENDOR">Vendor</option>
            <option value="ADMIN">Admin</option>
          </select>
        </label>
        <button type="submit">Create account</button>
      </form>
      <p class="muted">Already registered? <a href="/login.html">Login</a></p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value,
        hostelBlock: document.getElementById('hostelBlock').value,
        roomNumber: document.getElementById('roomNumber').value,
        role: document.getElementById('role').value
      };

      try {
        await apiFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        window.location.href = '/login.html';
      } catch (error) {
        const box = document.getElementById('message');
        box.textContent = error.message;
        box.style.display = 'block';
      }
    });
  </script>
</body>
</html>
