<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NightBite Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container screen-center">
    <div class="auth-box">
      <h2>Login</h2>
      <div id="message" class="alert" style="display:none"></div>
      <form id="loginForm">
        <label>Email<input type="email" id="email" required></label>
        <label>Password<input type="password" id="password" required></label>
        <button type="submit">Login</button>
      </form>
      <p class="muted">Need an account? <a href="/signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const result = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        localStorage.setItem('token', result.token);
        localStorage.setItem('role', result.role);
        localStorage.setItem('userId', result.userId);
        if (result.role === 'STUDENT') location.href = '/student-home.html';
        else if (result.role === 'VENDOR') location.href = '/vendor-dashboard.html';
        else location.href = '/admin.html';
      } catch (error) {
        const box = document.getElementById('message');
        box.textContent = error.message;
        box.style.display = 'block';
      }
    });
  </script>
</body>
</html>
